<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiCraft Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #080b0e;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
        }

        #game_frame {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Pantalla de login principal */
        #pantalla-login {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(16, 22, 28, 0.85) 0%, rgba(6, 8, 11, 0.98) 100%);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo ambiental sutil */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(46, 125, 50, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
        }

        /* Tarjeta Minimalista */
        .login-card {
            background: rgba(18, 24, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 36px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(76, 175, 80, 0.08);
            width: 400px;
            max-width: 90vw;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease-out;
        }

        .user-avatar-badge {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.25), rgba(27, 94, 32, 0.5));
            border: 2px solid rgba(76, 175, 80, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 24px rgba(76, 175, 80, 0.3);
        }

        .session-info {
            margin-bottom: 18px;
        }

        .session-welcome {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .session-user-name {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            word-break: break-word;
        }

        .session-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
            transform: translateY(-1px);
        }

        .btn-secondary:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .brand-logo span {
            color: #4CAF50;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clean-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 14, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        .clean-input:focus {
            border-color: #4CAF50;
            background: rgba(10, 14, 18, 0.95);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .play-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #43A047 0%, #1B5E20 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.35);
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(76, 175, 80, 0.45);
        }

        .play-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        /* Pantalla de carga */
        #mi-pantalla-carga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #06080c;
            z-index: 29999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.6s ease;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #msg-carga {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .forzar-entrada {
            color: #64748b;
            font-size: 13px;
            margin-top: 16px;
            cursor: pointer;
            border-bottom: 1px dashed #64748b;
            padding-bottom: 1px;
        }

        .forzar-entrada:hover {
            color: #a5d6a7;
            border-bottom-color: #a5d6a7;
        }

        /* Toast Skin Notification dentro del juego */
        #toast-skin {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 40000;
            background: rgba(18, 24, 30, 0.94);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(76, 175, 80, 0.4);
            border-radius: 12px;
            padding: 14px 18px;
            color: #ffffff;
            display: none;
            align-items: center;
            gap: 12px;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            animation: toastSlide 0.4s ease-out forwards;
        }

        @keyframes toastSlide {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-arrow-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .toast-text {
            font-size: 13.5px;
            color: #e2e8f0;
            line-height: 1.3;
        }

        .toast-text strong {
            color: #81c784;
        }

        .toast-action-link {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            text-decoration: underline;
        }

        .toast-action-link:hover {
            color: #ef4444;
        }

        .toast-close {
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
            margin-left: auto;
            align-self: flex-start;
        }

        .toast-close:hover { color: #ffffff; }
    </style>
</head>

<body>
    <!-- Toast Notification en Juego -->
    <div id="toast-skin">
        <img src="arrow.png" alt="Flecha" class="toast-arrow-img">
        <div class="toast-text" id="toast-text-content">
            <strong>¡Sesión activa!</strong> Conectado a LogiCraft.
        </div>
        <button class="toast-close" onclick="cerrarToastSkin()">✕</button>
    </div>

    <!-- Pantalla de Login Principal -->
    <div id="pantalla-login">
        <div class="bg-glow"></div>
        <div class="login-card">
            <div class="brand-logo">🟩 LogiCraft<span>Web</span></div>

            <!-- Vista de Sesión Guardada -->
            <div id="view-saved-session" style="display: none;">
                <div class="user-avatar-badge">👤</div>
                <div class="session-info">
                    <div class="session-welcome">Sesión Guardada</div>
                    <div class="session-user-name" id="saved-username-display">Jugador</div>
                </div>
                <p class="session-desc">¿Deseas continuar jugando con esta cuenta o prefieres cerrar sesión?</p>
                <button type="button" class="play-btn" onclick="usarSesionGuardada()">ENTRAR COMO <span id="btn-username-label">JUGADOR</span></button>
                <button type="button" class="btn-secondary" onclick="cerrarSesionGuardada()">Cerrar sesión / Cambiar cuenta</button>
            </div>

            <!-- Formulario de Login Normal -->
            <div id="view-normal-login" style="display: none;">
                <form id="view-form" onsubmit="event.preventDefault(); iniciarSesion();">
                    <div class="input-group">
                        <label class="input-label" for="username">Usuario</label>
                        <input type="text" id="username" class="clean-input" placeholder="Ingresa tu usuario" autocomplete="off" required>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="password">Contraseña</label>
                        <input type="password" id="password" class="clean-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="play-btn">JUGAR</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pantalla de Carga -->
    <div id="mi-pantalla-carga">
        <div class="spinner"></div>
        <h2 id="msg-carga">Cargando LogiCraft...</h2>
        <p class="forzar-entrada" onclick="quitarCarga()">Si tarda mucho, haz clic aquí</p>
    </div>

    <div id="game_frame"></div>

    <script>
        let _internalUsername = "Jugador";
        let _savedSessionData = null;
        let _toastMostrado = false;
        let _cargaQuitada = false;

        Object.defineProperty(window, 'loggedInUsername', {
            get: function () { return _internalUsername; },
            set: function (val) {
                console.error("Acceso denegado: No puedes cambiar el usuario manualmente.");
            },
            configurable: false
        });

        async function comprobarSesionGuardada() {
            try {
                const raw = localStorage.getItem('logicraft_saved_session');
                if (raw) {
                    _savedSessionData = JSON.parse(raw);
                    if (_savedSessionData && _savedSessionData.user && _savedSessionData.pwdHash) {
                        _internalUsername = _savedSessionData.user;
                        document.getElementById('saved-username-display').innerText = _savedSessionData.user;
                        document.getElementById('btn-username-label').innerText = _savedSessionData.user.toUpperCase();
                        document.getElementById('view-saved-session').style.display = 'block';
                        document.getElementById('view-normal-login').style.display = 'none';
                        return;
                    }
                }
            } catch (e) { console.error("Error leyendo sesión guardada:", e); }
            
            document.getElementById('view-saved-session').style.display = 'none';
            document.getElementById('view-normal-login').style.display = 'block';
        }

        async function usarSesionGuardada() {
            if (_savedSessionData && _savedSessionData.user && _savedSessionData.pwdHash) {
                document.getElementById('pantalla-login').style.display = 'none';
                await iniciarMotorJuego(_savedSessionData.user, _savedSessionData.pwdHash);
            }
        }

        function cerrarSesionGuardada() {
            try { localStorage.clear(); } catch (e) { console.error("Error al borrar localStorage:", e); }
            _savedSessionData = null;
            document.getElementById('view-saved-session').style.display = 'none';
            document.getElementById('view-normal-login').style.display = 'block';
            const u = document.getElementById('username');
            const p = document.getElementById('password');
            if (u) u.value = '';
            if (p) p.value = '';
        }

        function cerrarSesionYRecargar() {
            try { localStorage.clear(); } catch (e) { console.error("Error al borrar localStorage:", e); }
            _savedSessionData = null;
            location.reload();
        }

        function guardarSesion(user, pwdHash) {
            try {
                const sessionObj = {
                    user: user,
                    pwdHash: pwdHash,
                    savedAt: Date.now()
                };
                localStorage.setItem('logicraft_saved_session', JSON.stringify(sessionObj));
            } catch (e) { console.error("Error guardando sesión:", e); }
        }

        function mostrarToastSesionActiva(user) {
            if (_toastMostrado) return;
            _toastMostrado = true;

            const toast = document.getElementById('toast-skin');
            const content = document.getElementById('toast-text-content');
            if (toast && content) {
                content.innerHTML = `<strong>¡Sesión activa!</strong> Conectado como <b>${user}</b>.<br><span class="toast-action-link" onclick="cerrarSesionYRecargar()">Cerrar sesión / Cambiar cuenta</span>`;
                toast.style.display = 'flex';
                setTimeout(() => { cerrarToastSkin(); }, 9000);
            }
        }

        function cerrarToastSkin() {
            const toast = document.getElementById('toast-skin');
            if (toast) toast.style.display = 'none';
        }

        async function sha256(message) {
            const msgUint8 = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function iniciarSesion() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (!user || !pass) {
                alert("Por favor ingresa usuario y contraseña.");
                return;
            }

            _internalUsername = user;
            const pwdHash = await sha256(pass);
            guardarSesion(user, pwdHash);

            document.getElementById('pantalla-login').style.display = 'none';
            await iniciarMotorJuego(user, pwdHash);
        }

        function quitarCarga() {
            if (_cargaQuitada) return;
            _cargaQuitada = true;

            const loader = document.getElementById("mi-pantalla-carga");
            if (loader) {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    mostrarToastSesionActiva(_internalUsername);
                }, 600);
            }
        }

        async function inyectarPerfil() {
            try {
                if (localStorage.getItem("_eaglercraftX.p")) {
                    console.log("Perfil existente detectado. Conservando skin y configuración.");
                    return;
                }

                const templateB64 = "H4sIAAAAAAAA/z2MUQqAIBAFX0Rg4q06QicQ2Y8ITdz1/LVL5ft7wzAeWLGkWIlhm+FrIybZFH0gdZYrG7h1qvN5lFd3cJ2plZgJQYjlf6Ozq6viNDoGrIMHd5P6YHsAAAA=";
                const binaryStr = atob(templateB64);
                const gzipBytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) gzipBytes[i] = binaryStr.charCodeAt(i);
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter(); writer.write(gzipBytes); writer.close();
                const response = new Response(ds.readable);
                const uncompressedBuffer = await response.arrayBuffer();
                let uncompressed = new Uint8Array(uncompressedBuffer);
                const searchStr = "testusername";
                const searchBytes = new TextEncoder().encode(searchStr);
                let matchIdx = -1;
                for (let i = 0; i < uncompressed.length - searchBytes.length; i++) {
                    let match = true;
                    for (let j = 0; j < searchBytes.length; j++) { if (uncompressed[i + j] !== searchBytes[j]) { match = false; break; } }
                    if (match) { matchIdx = i; break; }
                }
                if (matchIdx !== -1) {
                    const nameBytes = new TextEncoder().encode(window.loggedInUsername.substring(0, 16));
                    const newUnc = new Uint8Array(uncompressed.length - searchBytes.length + nameBytes.length);
                    newUnc.set(uncompressed.subarray(0, matchIdx - 2), 0);
                    newUnc[matchIdx - 2] = (nameBytes.length >> 8) & 0xFF;
                    newUnc[matchIdx - 1] = nameBytes.length & 0xFF;
                    newUnc.set(nameBytes, matchIdx);
                    newUnc.set(uncompressed.subarray(matchIdx + searchBytes.length), matchIdx + nameBytes.length);
                    uncompressed = newUnc;
                }
                const cs = new CompressionStream('gzip');
                const writer2 = cs.writable.getWriter(); writer2.write(uncompressed); writer2.close();
                const response2 = new Response(cs.readable);
                const compressedBuffer = await response2.arrayBuffer();
                const compressed = new Uint8Array(compressedBuffer);
                let finalBinary = '';
                for (let i = 0; i < compressed.length; i++) finalBinary += String.fromCharCode(compressed[i]);
                localStorage.setItem("_eaglercraftX.p", btoa(finalBinary));
            } catch (e) { console.error("Error inyectando perfil:", e); }
        }

        async function iniciarMotorJuego(user, pwdHash) {
            document.getElementById('mi-pantalla-carga').style.display = 'flex';
            document.getElementById('msg-carga').innerText = "Entrando como " + user + "...";

            await inyectarPerfil();

            const wssUrl = `wss://webcraft.arielcapdevila.com/?username=${encodeURIComponent(user)}&pwd=${pwdHash}`;

            window.eaglercraftXOpts = {
                container: "game_frame",
                assetsURI: "assets.epk",
                fixedUsername: user,
                servers: [{ addr: wssUrl, name: "LogiCraft" }],
                hooks: {
                    screenChanged: function (screenName) {
                        if (screenName) quitarCarga();
                    }
                }
            };

            setTimeout(quitarCarga, 15000);

            if (typeof main === 'function') main();
        }

        comprobarSesionGuardada();
    </script>
    <script src="classes.js" defer></script>
</body>

</html>
